<!DOCTYPE html>
<html>
<head><title>Cookie Jar — Icon Generator</title></head>
<body>
<p>Open this file in a browser. Icons will download automatically.</p>
<canvas id="c" style="display:none"></canvas>
<script>
const sizes = [16, 32, 48, 128];
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function drawCookieJar(size) {
  canvas.width = canvas.height = size;
  ctx.clearRect(0, 0, size, size);

  const s = size / 128;

  // Background circle for small sizes
  if (size <= 32) {
    ctx.fillStyle = '#C4952A';
    ctx.beginPath();
    ctx.arc(size/2, size/2, size/2, 0, Math.PI*2);
    ctx.fill();
    // Cookie dots
    ctx.fillStyle = '#4A3018';
    [[0.4,0.4],[0.6,0.55],[0.55,0.65]].forEach(([x,y]) => {
      ctx.beginPath();
      ctx.arc(x*size, y*size, size*0.08, 0, Math.PI*2);
      ctx.fill();
    });
    return;
  }

  // Jar lid
  ctx.fillStyle = '#C4952A';
  ctx.beginPath();
  ctx.roundRect(24*s, 8*s, 80*s, 18*s, 9*s);
  ctx.fill();

  // Lid highlight
  ctx.fillStyle = '#E6CFA1';
  ctx.beginPath();
  ctx.roundRect(28*s, 6*s, 72*s, 8*s, 4*s);
  ctx.fill();

  // Jar neck
  ctx.fillStyle = '#FAF7F2';
  ctx.strokeStyle = '#E6D5C3';
  ctx.lineWidth = 2*s;
  ctx.fillRect(32*s, 24*s, 64*s, 14*s);
  ctx.strokeRect(32*s, 24*s, 64*s, 14*s);

  // Jar body
  ctx.fillStyle = 'rgba(255,251,245,0.96)';
  ctx.strokeStyle = '#E6D5C3';
  ctx.beginPath();
  ctx.moveTo(18*s, 38*s);
  ctx.bezierCurveTo(14*s, 60*s, 12*s, 80*s, 12*s, 96*s);
  ctx.bezierCurveTo(12*s, 112*s, 36*s, 122*s, 64*s, 122*s);
  ctx.bezierCurveTo(92*s, 122*s, 116*s, 112*s, 116*s, 96*s);
  ctx.bezierCurveTo(116*s, 80*s, 114*s, 60*s, 110*s, 38*s);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Cookie inside jar
  ctx.fillStyle = '#C4952A';
  ctx.strokeStyle = '#A87240';
  ctx.lineWidth = 1.5*s;
  ctx.beginPath();
  ctx.arc(64*s, 78*s, 22*s, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();

  // Chocolate chips
  ctx.fillStyle = '#4A3018';
  [[57,72,3],[70,82,3],[63,85,2.5],[72,71,2.5]].forEach(([x,y,r]) => {
    ctx.beginPath();
    ctx.arc(x*s, y*s, r*s, 0, Math.PI*2);
    ctx.fill();
  });
}

sizes.forEach(size => {
  drawCookieJar(size);
  const a = document.createElement('a');
  a.download = `icon${size}.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
});
</script>
</body>
</html>
