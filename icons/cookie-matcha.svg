<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <filter id="b" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.48" numOctaves="2" seed="12" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#B6C875"/>
      <stop offset="100%" stop-color="#7B9229"/>
    </linearGradient>
    <radialGradient id="spot" cx="40%" cy="35%" r="70%">
      <stop offset="0%"   stop-color="#FFE5DC"/>
      <stop offset="100%" stop-color="#F0CFBD"/>
    </radialGradient>
    <clipPath id="c"><circle cx="20" cy="20" r="19.5"/></clipPath>
  </defs>
  <g filter="drop-shadow(0 2px 3px rgba(60,80,20,0.4))">
    <g clip-path="url(#c)">
      <circle cx="20" cy="20" r="17" fill="url(#bg)" filter="url(#b)"/>
      <ellipse cx="12.0" cy="12.5" rx="3.5" ry="2.8" transform="rotate(-10 12.0 12.5)" fill="url(#spot)"/>
      <ellipse cx="10.1" cy="21.8" rx="3.2" ry="2.6" transform="rotate(6 10.1 21.8)"   fill="url(#spot)"/>
      <ellipse cx="17.7" cy="28.6" rx="3.5" ry="2.7" transform="rotate(-8 17.7 28.6)"  fill="url(#spot)"/>
      <ellipse cx="27.5" cy="10.5" rx="3.0" ry="2.5" transform="rotate(14 27.5 10.5)"  fill="url(#spot)"/>
    </g>
  </g>
</svg>
