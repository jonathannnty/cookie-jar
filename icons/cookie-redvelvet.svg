<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <filter id="b" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.48" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="bg" cx="38%" cy="35%" r="70%">
      <stop offset="0%"   stop-color="#EF8272"/>
      <stop offset="55%"  stop-color="#E47262"/>
      <stop offset="100%" stop-color="#C85848"/>
    </radialGradient>
    <radialGradient id="spot" cx="40%" cy="35%" r="70%">
      <stop offset="0%"   stop-color="#F5CFC0"/>
      <stop offset="100%" stop-color="#E898B1"/>
    </radialGradient>
    <clipPath id="c"><circle cx="20" cy="20" r="19.5"/></clipPath>
  </defs>
  <g filter="drop-shadow(0 2px 3px rgba(180,60,50,0.4))">
    <g clip-path="url(#c)">
      <circle cx="20" cy="20" r="17" fill="url(#bg)" filter="url(#b)"/>
      <ellipse cx="14.8" cy="11.2" rx="3.2" ry="2.5" transform="rotate(-12 14.8 11.2)" fill="url(#spot)"/>
      <ellipse cx="10.0" cy="23.1" rx="3.0" ry="2.4" transform="rotate(8 10.0 23.1)"   fill="url(#spot)"/>
      <ellipse cx="18.6" cy="27.3" rx="3.0" ry="2.4" transform="rotate(-5 18.6 27.3)"  fill="url(#spot)"/>
      <ellipse cx="25.8" cy="9.6"  rx="3.2" ry="2.5" transform="rotate(15 25.8 9.6)"   fill="url(#spot)"/>
      <ellipse cx="28.3" cy="16.9" rx="3.0" ry="2.3" transform="rotate(-10 28.3 16.9)" fill="url(#spot)"/>
    </g>
  </g>
</svg>
