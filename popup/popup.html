<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cookie Jar</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

<!-- Hand-drawn border filter (Drone brush approximation) -->
<svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true">
  <defs>
    <filter id="hd" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
<div class="widget-shell">
<div class="widget">

  <!-- ══ Wooden header bar ══ -->
  <div class="widget-header">
    <div class="widget-header-left">
      <img class="header-jar-icon" src="../figma/svg/CookieJarLogo.svg" alt="Cookie Jar">
    </div>
    <span class="widget-title">Cookie Jar</span>
    <div class="widget-header-right">
      <button class="header-btn" id="btnFullPage" title="Open full page">
        <img src="../figma/svg/OpenNewLinkIcon.svg" alt="">
      </button>
    </div>
  </div>

  <!-- ══ Jar body (cookie list) ══ -->
  <div class="widget-body" id="widgetBody">
    <div class="toggle-list">
      <!-- Row: Session Cookies -->
      <div class="toggle-row" data-cat="session">
        <label class="cookie-toggle" data-flavor="choc">
          <input type="checkbox" id="tog-session">
          <div class="cookie-track">
            <div class="cookie-thumb"><img src="../icons/cookie-choc.svg" alt=""></div>
          </div>
        </label>
        <span class="toggle-label">Session Cookies</span>
        <button class="info-btn" data-cat="session"><img src="../figma/svg/InfoIcon.svg" alt="Info"></button>
      </div>

      <div class="toggle-divider"></div>

      <!-- Row: Auth Cookies -->
      <div class="toggle-row" data-cat="authentication">
        <label class="cookie-toggle" data-flavor="matcha">
          <input type="checkbox" id="tog-auth">
          <div class="cookie-track">
            <div class="cookie-thumb"><img src="../icons/cookie-matcha.svg" alt=""></div>
          </div>
        </label>
        <span class="toggle-label">Auth Cookies</span>
        <button class="info-btn" data-cat="authentication"><img src="../figma/svg/InfoIcon.svg" alt="Info"></button>
      </div>

      <div class="toggle-divider"></div>

      <!-- Row: Tracking Cookies -->
      <div class="toggle-row" data-cat="tracking">
        <label class="cookie-toggle" data-flavor="mm">
          <input type="checkbox" id="tog-tracking">
          <div class="cookie-track">
            <div class="cookie-thumb"><img src="../icons/cookie-mm.svg" alt=""></div>
          </div>
        </label>
        <span class="toggle-label">Tracking Cookies</span>
        <button class="info-btn" data-cat="tracking"><img src="../figma/svg/InfoIcon.svg" alt="Info"></button>
      </div>

      <div class="toggle-divider"></div>

      <!-- Row: Third-Party Cookies -->
      <div class="toggle-row" data-cat="third-party">
        <label class="cookie-toggle" data-flavor="redvelvet">
          <input type="checkbox" id="tog-thirdparty">
          <div class="cookie-track">
            <div class="cookie-thumb"><img src="../icons/cookie-redvelvet.svg" alt=""></div>
          </div>
        </label>
        <span class="toggle-label">Third-Party Cookies</span>
        <button class="info-btn" data-cat="third-party"><img src="../figma/svg/InfoIcon.svg" alt="Info"></button>
      </div>
    </div>
  </div><!-- .widget-body -->

  <!-- ══ Settings modal ══ -->
  <div class="settings-overlay" id="settingsOverlay">
    <div class="settings-inner">
      <div class="settings-title">Settings</div>
      <div class="settings-subtitle">Set Your Cookie Preferences</div>

      <!-- Basic 2-column grid -->
      <div class="settings-grid" id="settingsBasicGrid">
        <!-- Session -->
        <div class="settings-row">
          <label class="settings-toggle" data-flavor="choc">
            <input type="checkbox" data-cat="session">
            <div class="settings-track">
              <div class="settings-thumb"><img src="../icons/cookie-choc.svg" alt=""></div>
            </div>
          </label>
          <span class="settings-row-label">Session Cookies</span>
        </div>
        <!-- Tracking -->
        <div class="settings-row">
          <label class="settings-toggle" data-flavor="mm">
            <input type="checkbox" data-cat="tracking">
            <div class="settings-track">
              <div class="settings-thumb"><img src="../icons/cookie-mm.svg" alt=""></div>
            </div>
          </label>
          <span class="settings-row-label">Tracking Cookies</span>
        </div>
        <!-- Auth -->
        <div class="settings-row">
          <label class="settings-toggle" data-flavor="matcha">
            <input type="checkbox" data-cat="authentication">
            <div class="settings-track">
              <div class="settings-thumb"><img src="../icons/cookie-matcha.svg" alt=""></div>
            </div>
          </label>
          <span class="settings-row-label">Authentication Cookies</span>
        </div>
        <!-- Third-party -->
        <div class="settings-row">
          <label class="settings-toggle" data-flavor="redvelvet">
            <input type="checkbox" data-cat="third-party">
            <div class="settings-track">
              <div class="settings-thumb"><img src="../icons/cookie-redvelvet.svg" alt=""></div>
            </div>
          </label>
          <span class="settings-row-label">Third-Party Cookies</span>
        </div>
      </div>

      <!-- Advanced Settings collapsible -->
      <button class="advanced-toggle-btn" id="advancedToggleBtn">
        Advanced Settings <span class="chevron">▲</span>
      </button>
      <div class="advanced-section" id="advancedSection">
        <div class="settings-grid" style="margin-top:10px">
          <!-- Analytics -->
          <div class="settings-row">
            <label class="settings-toggle" data-flavor="matcha">
              <input type="checkbox" data-cat="analytics">
              <div class="settings-track">
                <div class="settings-thumb"><img src="../icons/cookie-matcha.svg" alt=""></div>
              </div>
            </label>
            <span class="settings-row-label">Analytics Cookies</span>
          </div>
          <!-- Advertising -->
          <div class="settings-row">
            <label class="settings-toggle" data-flavor="redvelvet">
              <input type="checkbox" data-cat="advertising">
              <div class="settings-track">
                <div class="settings-thumb"><img src="../icons/cookie-redvelvet.svg" alt=""></div>
              </div>
            </label>
            <span class="settings-row-label">Advertising Cookies</span>
          </div>
          <!-- Functional -->
          <div class="settings-row">
            <label class="settings-toggle" data-flavor="matcha">
              <input type="checkbox" data-cat="functional" checked>
              <div class="settings-track">
                <div class="settings-thumb"><img src="../icons/cookie-matcha.svg" alt=""></div>
              </div>
            </label>
            <span class="settings-row-label">Functional Cookies</span>
          </div>
          <!-- Unknown -->
          <div class="settings-row">
            <label class="settings-toggle" data-flavor="choc">
              <input type="checkbox" data-cat="unknown">
              <div class="settings-track">
                <div class="settings-thumb"><img src="../icons/cookie-choc.svg" alt=""></div>
              </div>
            </label>
            <span class="settings-row-label">Unknown Cookies</span>
          </div>
        </div>
      </div>
    </div><!-- .settings-inner -->

    <div class="settings-footer">
      <button class="btn btn-cancel" id="btnSettingsCancel">Cancel</button>
      <button class="btn btn-save"   id="btnSettingsSave">Save</button>
    </div>
  </div><!-- .settings-overlay -->

</div><!-- .widget -->
</div>


<!-- Info popover lives outside .widget so overflow:hidden never clips it -->
<div class="info-popover" id="infoPopover">
  <div id="infoBody"></div>
</div>

<div class="toast" id="toast"></div>

<script src="../utils/cookie-classifier.js"></script>
<script src="../utils/prefs.js"></script>
<script src="popup.js"></script>
</body>
</html>
